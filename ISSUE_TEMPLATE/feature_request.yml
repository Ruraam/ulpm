name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour (CLI example if relevant)
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
