name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ULPM version
      description: Output of `ulpm version`
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: "`ulpm doctor` output"
      render: text
    validations: {required: true}
  - type: input
    id: distro
    attributes:
      label: Distribution, kernel, bwrap version
      placeholder: "Debian 13, 6.12, bubblewrap 0.10"
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands (including flags such as --offline / --no-gpu)
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations: {required: true}
  - type: markdown
    attributes:
      value: "Security problem? Do **not** open a public issue, see SECURITY.md."
