name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. Lint + Syntax check
  # --------------------------------------------------
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check (bash -n)
        run: |
          for f in ulpm install.sh lib/*.sh; do
            echo "Checking syntax: $f"
            bash -n "$f"
          done

      - name: ShellCheck (errors, blocking)
        run: |
          find . -type f \( -name "*.sh" -o -name "ulpm" \) -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck -x --severity=error --exclude=SC1090,SC1091

      - name: ShellCheck (warnings, report only)
        continue-on-error: true
        run: |
          find . -type f \( -name "*.sh" -o -name "ulpm" \) -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck -x --severity=warning \
              --exclude=SC1090,SC1091,SC2034,SC2086,SC2155,SC2015,SC2016

  # --------------------------------------------------
  # 2. Tests (bats)
  # --------------------------------------------------
  test:
    name: Tests (bats)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bats \
            bubblewrap \
            squashfs-tools \
            squashfuse \
            fuse3 \
            jq \
            curl \
            openssl \
            file \
            coreutils \
            xdg-dbus-proxy \
            xdg-utils \
            shared-mime-info

      - name: Allow unprivileged user namespaces (bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Make scripts executable
        run: chmod +x ulpm install.sh lib/*.sh

      - name: Run bats tests
        run: bats --tap tests/

  # --------------------------------------------------
  # 3. Matrix multi-distro (smoke test)
  # --------------------------------------------------
  matrix:
    name: Compatibility (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:bookworm
          - debian:trixie
          - fedora:latest
          - archlinux:latest
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime deps
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y bash bubblewrap squashfs-tools squashfuse fuse3 jq curl openssl file coreutils
          elif command -v dnf >/dev/null; then
            dnf install -y --allowerasing bash bubblewrap squashfs-tools squashfuse fuse3 jq curl openssl file coreutils
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm bash bubblewrap squashfs-tools squashfuse fuse3 jq curl openssl file coreutils
          else
            echo "No supported package manager in this image" >&2
            exit 1
          fi

      - name: Syntax + smoke test
        run: |
          for f in ulpm install.sh lib/*.sh; do
            bash -n "$f"
          done
          chmod +x ulpm
          # Sans "|| true" : un échec doit faire rougir le job.
          ./ulpm version
          ./ulpm help > /dev/null
          if ./ulpm thiscommanddoesnotexist > /dev/null 2>&1; then
            echo "an unknown command must exit with a non-zero status" >&2
            exit 1
          fi
