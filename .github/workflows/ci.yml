name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          for file in bin/* lib/*.sh install.sh tests/*.sh; do
            bash -n "$file"
          done
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x bin/ulpm bin/ulrm lib/*.sh install.sh tests/*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap openssl jq squashfs-tools
      - name: Run test suite
        run: bash tests/run.sh
