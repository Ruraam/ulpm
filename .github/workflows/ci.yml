name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # Permet de lancer manuellement

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. Lint + Syntax check
  # --------------------------------------------------
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # Tous les scripts Bash
          find . -type f \( -name "*.sh" -o -name "ulpm" -o -name "install.sh" \) \
            -not -path "./.git/*" \
            -print0 | xargs -0 shellcheck --severity=error --severity=warning --severity=info \
            --exclude=SC1091,SC2034,SC2086,SC2155,SC2015,SC2016 || true

          # Version stricte (échoue sur error + warning)
          #find . -type f \( -name "*.sh" -o -name "ulpm" -o -name "install.sh" \) \
          #  -not -path "./.git/*" \
          #  -print0 | xargs -0 shellcheck --severity=error --severity=warning \
          #  --exclude=SC1091  # source de fichiers locaux

      - name: Bash syntax check (bash -n)
        run: |
          set -e
          for f in ulpm install.sh lib/*.sh; do
            echo "Checking syntax: $f"
            bash -n "$f"
          done

  # --------------------------------------------------
  # 2. Tests (bats)
  # --------------------------------------------------
  test:
    name: Tests (bats)
    runs-on: ubuntu-latest
    needs: lint                    # Attend que le lint passe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bats \
            bubblewrap \
            squashfs-tools \
            squashfuse \
            fuse3 \
            jq \
            curl \
            openssl \
            file \
            coreutils \
            xdg-dbus-proxy

      - name: Run bats tests
        run: |
          # Si tu n’as pas encore de tests, ce step passera en créant un dossier vide
          if [ -d "tests" ]; then
            bats tests/ --tap
          else
            echo "No tests/ directory yet — skipping"
            mkdir -p tests
            echo "#!/usr/bin/env bats" > tests/placeholder.bats
            echo "@test \"placeholder\" { true; }" >> tests/placeholder.bats
            bats tests/ --tap
          fi

  # --------------------------------------------------
  # 3. Matrix multi-distro (optionnel mais très pro)
  # --------------------------------------------------
  matrix:
    name: Compatibility
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:bookworm
          - fedora:40
          - archlinux:latest
    container:
      image: ${{ matrix.image }}
      options: --privileged   # nécessaire pour bubblewrap / user namespaces
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime deps
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y bash bubblewrap squashfs-tools squashfuse fuse3 jq curl openssl file coreutils
          elif command -v dnf >/dev/null; then
            dnf install -y bash bubblewrap squashfs-tools squashfuse fuse3 jq curl openssl file coreutils
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm bash bubblewrap squashfs-tools squashfuse fuse3 jq curl openssl file coreutils
          fi

      - name: Syntax + basic smoke test
        run: |
          bash -n ulpm
          bash -n install.sh
          ./ulpm version || true
          ./ulpm help || true
