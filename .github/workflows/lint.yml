name: Lint

on:
  push:
    branches:
      - ulpm-staging
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run static checks (syntax, whitespace, shellcheck)
        run: make check
