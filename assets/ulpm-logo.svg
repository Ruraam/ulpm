<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>
<!-- Dégradé Cube - Face Supérieure -->
<linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#38bdf8" />
<stop offset="100%" stop-color="#0284c7" />
</linearGradient>

<!-- Dégradé Cube - Face Gauche -->
<linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0284c7" />
<stop offset="100%" stop-color="#0369a1" />
</linearGradient>

<!-- Dégradé Cube - Face Droite -->
<linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0ea5e9" />
<stop offset="100%" stop-color="#075985" />
</linearGradient>

<!-- Dégradé Bordure de Bulle (Bubblewrap / Isolation) -->
<linearGradient id="bubbleRing" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
<stop offset="40%" stop-color="#818cf8" stop-opacity="0.5" />
<stop offset="80%" stop-color="#06b6d4" stop-opacity="0.2" />
<stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
</linearGradient>

<!-- Dégradé Corps de Bulle Translucide -->
<radialGradient id="bubbleGlow" cx="35%" cy="30%" r="70%">
<stopoffset="0%" stop-color="#e0f2fe" stop-opacity="0.35" />
<stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
<stop offset="85%" stop-color="#0284c7" stop-opacity="0.18" />
<stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
</radialGradient>

<!-- Ombre au sol -->
<radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
<stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
</radialGradient>

<!-- Filtre Flou Léger pour les reflets -->
<filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="3" />
</filter>
</defs>

<!-- Ombre douce sous la bulle -->
<ellipse cx="256" cy="460" rx="140" ry="20" fill="url(#groundShadow)" />

<!-- Corps de la bulle -->
<circle cx="256" cy="240" r="190" fill="url(#bubbleGlow)" />
<circle cx="256" cy="240" r="190" fill="none" stroke="url(#bubbleRing)" stroke-width="4.5" />

<!-- Reflet secondaire (bas droite) -->
<pathd="M 370 340 A 175 175 0 0 1 200 415" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4" />

<!-- CUBE ISOMETRIQUE CENTRAL(Le Paquet .lpk) -->
<g id="isometric-cube">
<!-- Face Supérieure -->
<polygon points="256,150 330,192 256,234 182,192" fill="url(#cubeTop)" stroke="#7dd3fc" stroke-width="1.5" stroke-linejoin="round" />

<!-- Face Gauche -->
<polygon points="182,192 256,234 256,320 182,278" fill="url(#cubeLeft)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />

<!-- Face Droite -->
<polygon points="256,234330,192 330,278 256,320"fill="url(#cubeRight)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />

<!-- Bandelette / Sceau central du paquet (Style Ruban paquet zstd) -->
<polygonpoints="256,150 270,158 210,192 196,184" fill="#f8fafc" opacity="0.3" />
<polygon points="210,192 224,200 224,286 210,278" fill="#f8fafc" opacity="0.2" />
</g>

<!-- Reflets brillants sur la bulle (Effet verre/sphère) -->
<!-- Arc lumineuxsupérieur gauche -->
<path d="M 140 160 A 160 160 0 01 270 95" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75" filter="url(#softGlow)" />
<path d="M 140 160 A 160 160 0 0 1 270 95" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />

<!-- Point lumineux brillant -->
<circle cx="130" cy="180" r="5" fill="#ffffff" opacity="0.7" />
</svg>
